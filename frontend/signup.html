<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Personal Finance Tracker | Create Account</title>

    <!-- Theme -->

    <script>

        const theme = localStorage.getItem("theme") || "dark";

        document.documentElement.setAttribute("data-theme", theme);

    </script>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Signup CSS -->

    <link rel="stylesheet"
          href="css/signup.css">

</head>

<body>

    <!-- ===================================== -->
    <!-- SIGNUP CONTAINER -->
    <!-- ===================================== -->

    <div class="signup-container">

        <div class="signup-box">

            <h1>Create Account</h1>

            <p>

                Join AI Personal Finance Tracker and start managing your finances smarter.

            </p>

            <!-- ===================================== -->
            <!-- SIGNUP FORM -->
            <!-- ===================================== -->

            <form id="signupForm">

                <!-- Full Name -->

                <input

                    type="text"

                    id="name"

                    placeholder="Full Name"

                    maxlength="100"

                    autocomplete="name"

                    required>

                <!-- Email -->

                <input

                    type="email"

                    id="email"

                    placeholder="Email Address"

                    maxlength="100"

                    autocomplete="email"

                    required>

                <!-- Password -->

                <div class="password-container">

                    <input

                        type="password"

                        id="password"

                        placeholder="Create Password"

                        minlength="8"

                        maxlength="50"

                        autocomplete="new-password"

                        required>

                    <span

                        class="toggle-password"

                        onclick="togglePassword('password',this)">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

                <!-- Confirm Password -->

                <div class="password-container">

                    <input

                        type="password"

                        id="confirmPassword"

                        placeholder="Confirm Password"

                        minlength="8"

                        maxlength="50"

                        autocomplete="new-password"

                        required>

                    <span

                        class="toggle-password"

                        onclick="togglePassword('confirmPassword',this)">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

                <!-- Create Account Button -->

                <button

                    type="button"

                    id="createAccountBtn"

                    onclick="signup()">

                    Create Account

                </button>

                <!-- Message -->

                <p

                    id="message"

                    class="signup-message">

                </p>

                <!-- Login -->

                <p class="login-link">

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

            </form>

        </div>

    </div>

    <!-- ===================================== -->
    <!-- LOADER -->
    <!-- ===================================== -->

    <div id="loader" class="loader-overlay">

        <div class="loader"></div>

    </div>

    <!-- ===================================== -->
    <!-- SCRIPT -->
    <!-- ===================================== -->

    <script src="js/signup.js"></script>

</body>

</html>
